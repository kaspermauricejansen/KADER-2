<!-- WALKTHROUGH-VENSTER -->
<div id="walkthroughModal" class="fixed inset-0 z-[130] hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="absolute inset-0 bg-coal/90 backdrop-blur-md" data-modal-close></div>
  <div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-[94%] max-w-4xl">
    <div class="bg-coal rounded-3xl overflow-hidden shadow-2xl border border-white/10">
      <div class="flex items-center justify-between p-4 sm:p-5 border-b border-white/10">
        <div>
          <span class="text-[10px] uppercase font-bold tracking-widest text-bronze-light">Cinematische Walkthrough</span>
          <h2 id="modalTitle" class="text-base sm:text-lg font-extrabold text-cream"></h2>
        </div>
        <button type="button" data-modal-close class="w-9 h-9 rounded-full border border-white/20 grid place-items-center text-cream hover:bg-white/10 transition-colors" aria-label="Venster sluiten">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="relative aspect-video bg-black overflow-hidden select-none">
        <div id="modalScenes" class="absolute inset-0"></div>
        <div class="absolute inset-0 vignette pointer-events-none"></div>
        <div class="absolute top-4 left-4 flex items-center gap-2 bg-coal/70 backdrop-blur-md border border-white/15 px-3 py-1.5 rounded-full text-cream text-[10px] font-extrabold uppercase tracking-widest">
          <span class="w-2 h-2 rounded-full bg-red-500 rec-blink" aria-hidden="true"></span>
          <span>4K Cinematic · 24 fps</span>
        </div>
        <div class="absolute bottom-0 inset-x-0 p-4 bg-gradient-to-t from-coal via-coal/60 to-transparent">
          <div class="flex items-center gap-3 text-cream">
            <button type="button" id="modalPlayBtn" class="w-10 h-10 rounded-full bg-cream text-ink grid place-items-center hover:bg-bronze hover:text-white transition-colors shrink-0" aria-label="Afspelen">
              <svg id="modalPlayIcon" class="w-4 h-4 ml-0.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            </button>
            <div class="flex-1 h-1 bg-white/20 rounded-full overflow-hidden">
              <div id="modalProgress" class="h-full bg-bronze-light rounded-full transition-all duration-100" style="width:0%"></div>
            </div>
            <span id="modalTime" class="text-xs font-bold tabular-nums shrink-0">0:00 / 0:24</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

  <div class="absolute inset-0 flex items-center justify-center p-6 sm:p-16 pointer-events-none">
